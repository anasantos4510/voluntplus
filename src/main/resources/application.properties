spring.application.name=voluntplus

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.cors.allowed-origin=${FRONTEND_URL}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER_URI}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Armazenamento local das imagens de serviços.
app.images.directory=${APP_IMAGE_DIR:./data/images}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
